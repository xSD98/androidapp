plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'com.google.gms.google-services'
}

android {
    namespace 'com.example.tieniiltempo'
    compileSdk 35

    defaultConfig {
        applicationId "com.example.tieniiltempo"
        minSdk 27
        targetSdk 35
        versionCode 1
        versionName "1.0"
    }

    buildFeatures { compose true }
    composeOptions { kotlinCompilerExtensionVersion = "1.5.15" }
    kotlinOptions { jvmTarget = '1.8' }
}

dependencies {
    // Firebase (BOM)
    implementation(platform("androidx.compose:compose-bom:2024.04.01"))
    implementation("androidx.compose.material3:material3")
    implementation("androidx.compose.material:material")
    implementation platform("com.google.firebase:firebase-bom:33.4.0")
    implementation "com.google.firebase:firebase-auth-ktx"
    implementation "com.google.firebase:firebase-firestore-ktx"
    implementation "com.google.firebase:firebase-messaging-ktx"

    // AndroidX / Compose / UI
    implementation "androidx.core:core-ktx:1.13.1"
    implementation "androidx.appcompat:appcompat:1.7.0"
    implementation "com.google.android.material:material:1.12.0"
    implementation("androidx.compose.material:material-icons-extended")

    implementation "androidx.activity:activity-compose:1.9.2"
    implementation "androidx.lifecycle:lifecycle-runtime-ktx:2.8.6"
    implementation "androidx.compose.ui:ui-text:1.7.3"
    implementation "androidx.compose.ui:ui:1.7.3"
    implementation "androidx.compose.material3:material3:1.3.0"
    implementation "androidx.compose.ui:ui-tooling-preview:1.7.3"
    debugImplementation "androidx.compose.ui:ui-tooling:1.7.3"

    // Navigation Compose
    implementation "androidx.navigation:navigation-compose:2.8.2"

    // Coil immagini (commenti, avatar)
    implementation "io.coil-kt:coil-compose:2.6.0"

    // Play Services (location per sub-attività “Segnala posizione”)
    implementation "com.google.android.gms:play-services-location:21.3.0"
}
